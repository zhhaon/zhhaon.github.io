<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haonan Zhang — Personal Profile</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #5b6878;
    --accent: #2f6fb3;
    --line: #e2e7ee;
    --bg: #f6f8fb;
    --card: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 56px 20px;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #e8f0f9 0%, var(--bg) 60%);
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 44px 48px 48px;
    box-shadow: 0 18px 50px rgba(28, 36, 48, 0.07);
  }

  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }

  .avatar {
    flex: 0 0 auto;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #2f6fb3, #4f9bd8);
    color: #fff;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .name {
    margin: 0;
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -0.3px;
  }

  .name .native {
    display: block;
    margin-top: 2px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 2px;
    color: var(--muted);
  }

  h2 {
    margin: 36px 0 18px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .entry {
    position: relative;
    padding-left: 26px;
    padding-bottom: 4px;
    border-left: 2px solid var(--line);
  }

  .entry::before {
    content: "";
    position: absolute;
    left: -7px;
    top: 8px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
  }

  .entry-title {
    margin: 0 0 4px;
    font-size: 17px;
    font-weight: 600;
  }

  .entry-sub {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
  }

  .period {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 10px;
    border-radius: 999px;
    background: #eef4fb;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    vertical-align: 2px;
    white-space: nowrap;
  }

  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .card { padding: 32px 24px 36px; }
    header { flex-direction: column; align-items: flex-start; gap: 14px; }
    .name { font-size: 25px; }
    .period { display: block; margin: 6px 0 0; width: fit-content; }
  }
</style>
</head>
<body>

  <main class="card">
    <header>
      <div class="avatar" aria-hidden="true">HZ</div>
      <div>
        <h1 class="name">
          Haonan Zhang
          <span class="native">张浩男</span>
        </h1>
      </div>
    </header>

    <section aria-labelledby="education">
      <h2 id="education">Education</h2>

      <div class="entry">
        <p class="entry-title">
          Master's Student
          <span class="period">2026 — Present</span>
        </p>
        <p class="entry-sub">Hangzhou Dianzi University</p>
      </div>
    </section>

    <footer>
      &copy; 2026 Haonan Zhang. All rights reserved.
    </footer>
  </main>

</body>
</html>
